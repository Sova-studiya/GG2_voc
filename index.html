<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Go Getter 2 — словарь</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --paper:#F6F9FF; --grid:#D8E5F8; --ink:#1B2A4A; --ink-soft:#52628A;
  --card:#FFFFFF; --edge:#1B2A4A; --shadow:#1B2A4A;
  --pen:#E5484D; --ok:#1FA971; --ok-bg:#DDF5EA; --bad-bg:#FFE3E3; --hl:#FFF3BF;
  --blue:#3B6BDB; --yellow:#FFC93C; --orange:#FF8A3D;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0F1930; --grid:#1A2A4A; --ink:#E9EFFF; --ink-soft:#A9B8DA;
    --card:#18274A; --edge:#7C93C9; --shadow:#070D1B;
    --pen:#FF6B70; --ok:#34D399; --ok-bg:#0F3A2C; --bad-bg:#4B1E28; --hl:#4A4112;
  }
}
:root[data-theme="dark"]{
  --paper:#0F1930; --grid:#1A2A4A; --ink:#E9EFFF; --ink-soft:#A9B8DA;
  --card:#18274A; --edge:#7C93C9; --shadow:#070D1B;
  --pen:#FF6B70; --ok:#34D399; --ok-bg:#0F3A2C; --bad-bg:#4B1E28; --hl:#4A4112;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0; min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:24px 24px;
  color:var(--ink);
  font-family:'Nunito','Trebuchet MS','Segoe UI',system-ui,sans-serif;
  font-weight:700; font-size:17px; line-height:1.35;
}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.hand{font-family:'Caveat','Segoe Script','Comic Sans MS',cursive;font-weight:700}
.wrap{max-width:1040px;margin:0 auto;padding:18px 16px 56px}
.wrap.narrow{max-width:680px}

/* hero */
.hero{padding:14px 0 6px}
.hero h1{margin:0;font-size:clamp(52px,11vw,92px);line-height:1;position:relative;display:inline-block;padding-bottom:10px}
.hero h1::after{content:'';position:absolute;left:0;right:0;bottom:0;height:9px;
  background:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='24' height='9' viewBox='0 0 24 9'><path d='M0 4.5 Q6 0 12 4.5 T24 4.5' fill='none' stroke='%23E5484D' stroke-width='2.6' stroke-linecap='round'/></svg>") repeat-x}
.hero p{margin:12px 0 0;max-width:560px;color:var(--ink-soft);font-size:18px}
.note{margin-top:10px;font-size:14px;color:var(--pen)}
.sec h2{margin:30px 0 14px;font-size:36px;line-height:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:20px}

/* group card */
.card{position:relative;display:flex;flex-direction:column;gap:14px;padding:18px 14px 14px;text-align:left;
  background:var(--card);border:2.5px solid var(--edge);border-radius:20px;box-shadow:5px 5px 0 var(--shadow);
  transition:transform .12s,box-shadow .12s}
.card::before{content:'';position:absolute;left:22px;top:-2.5px;width:46px;height:14px;background:var(--c);
  border:2.5px solid var(--edge);border-top:none;border-radius:0 0 8px 8px}
@media (hover:hover){.card:hover{transform:translate(-2px,-2px);box-shadow:7px 7px 0 var(--shadow)}}
.card:active{transform:translate(3px,3px);box-shadow:2px 2px 0 var(--shadow)}
.mos{display:flex;gap:8px;height:84px}
.mos .pic{flex:1 1 0;min-width:0}
.ct b{display:block;font-size:22px;font-weight:900;line-height:1.15}
.ct span{color:var(--ink-soft);font-size:15px}
.dots{display:flex;gap:6px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--edge)}
.dots i.on{background:var(--c)}

/* pictures */
.pic{background:#fff;border:2.5px solid var(--edge);border-radius:16px;display:grid;place-items:center;overflow:hidden;flex:none;color:#1B2A4A}
.pic img{max-width:88%;max-height:88%;object-fit:contain;display:block;user-select:none;-webkit-user-drag:none}
.pic .num{font-weight:900;color:#E8741F;line-height:1}
.pic.xs{height:84px;width:100%}.pic.xs .num{font-size:34px}
.pic.sm{width:72px;height:72px}.pic.sm .num{font-size:30px}
.pic.md{width:128px;height:128px}.pic.md .num{font-size:54px}
.pic.lg{width:min(190px,52vw);height:min(190px,52vw)}.pic.lg .num{font-size:74px}
.pic.mini{width:40px;height:40px;border-radius:10px;border-width:2px}.pic.mini .num{font-size:18px}

/* top bar */
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.top h2{margin:0;font-size:22px;font-weight:900;flex:1;line-height:1.15}
.top h2 small{display:block;font-size:14px;font-weight:700;color:var(--ink-soft)}
.ic{width:46px;height:46px;flex:none;display:grid;place-items:center;font-size:22px;background:var(--card);
  border:2.5px solid var(--edge);border-radius:14px;box-shadow:3px 3px 0 var(--shadow);color:var(--ink)}
.ic:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.progrow{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.prog{flex:1;height:16px;border:2.5px solid var(--edge);border-radius:99px;background:var(--card);overflow:hidden}
.prog i{display:block;height:100%;width:0;background:var(--c);transition:width .3s}
.count{font-weight:900;color:var(--ink-soft);min-width:52px;text-align:right}

/* levels */
.lvgrid{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:720px){.lvgrid{grid-template-columns:1fr 1fr}}
.lv{display:grid;grid-template-columns:56px 1fr 44px;align-items:center;gap:14px;padding:12px;text-align:left;
  background:var(--card);border:2.5px solid var(--edge);border-radius:18px;box-shadow:4px 4px 0 var(--shadow);
  transition:transform .12s,box-shadow .12s}
.lv:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--shadow)}
.lvn{width:56px;height:56px;border-radius:14px;border:2.5px solid var(--edge);background:var(--c);color:var(--on);
  display:grid;place-items:center;font-size:28px;font-weight:900}
.lv b{display:block;font-size:19px;font-weight:900;line-height:1.15}
.lv span{font-size:14px;color:var(--ink-soft)}
.mark{width:42px;height:42px;border:3px solid var(--pen);border-radius:50%;color:var(--pen);display:grid;place-items:center;
  font-size:32px;line-height:1;transform:rotate(-8deg)}
.mark.empty{border:2.5px dashed var(--grid);transform:none;opacity:.9}
.mark.tick{font-family:'Nunito',sans-serif;font-size:22px;font-weight:900}
.tools{display:flex;gap:10px;flex-wrap:wrap;margin:0 0 16px}

/* buttons */
.btn{padding:12px 22px;border-radius:14px;border:2.5px solid var(--edge);background:var(--card);color:var(--ink);
  font-weight:900;font-size:18px;box-shadow:3px 3px 0 var(--shadow)}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.btn.primary{background:var(--blue);color:#fff}
.btn:disabled{opacity:.5;pointer-events:none}
.say{width:76px;height:76px;border-radius:50%;background:var(--yellow);color:#1B2A4A;border:2.5px solid var(--edge);
  box-shadow:3px 3px 0 var(--shadow);display:grid;place-items:center;flex:none}
.say:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.say.sm{width:46px;height:46px}.say.sm svg{width:24px;height:24px}
.say.xl{width:112px;height:112px}.say.xl svg{width:52px;height:52px}
.say svg{width:34px;height:34px}

/* question */
.qcard{display:flex;flex-direction:column;align-items:center;gap:16px;padding:22px 16px;background:var(--card);
  border:2.5px solid var(--edge);border-radius:22px;box-shadow:5px 5px 0 var(--shadow)}
.ask{margin:0;font-weight:800;color:var(--ink-soft);font-size:16px;text-align:center}
.big{font-size:clamp(34px,9vw,54px);font-weight:900;text-align:center;line-height:1.1;overflow-wrap:anywhere}
.hint{font-size:20px;font-weight:800;color:var(--ink-soft);text-align:center;margin-top:-6px}
.ph{min-height:0;display:flex;justify-content:center}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.opt{display:flex;align-items:center;gap:8px;min-height:66px;padding:10px 12px;text-align:left;background:var(--card);
  border:2.5px solid var(--edge);border-radius:16px;box-shadow:3px 3px 0 var(--shadow);font-weight:800;
  font-size:clamp(16px,4.6vw,21px);line-height:1.15;overflow-wrap:anywhere;hyphens:auto}
.opt i{font-style:normal;flex:none;width:24px;height:24px;border-radius:8px;border:2px solid var(--edge);display:grid;
  place-items:center;font-size:13px;color:var(--ink-soft)}
@media (hover:none){.opt i{display:none}}
@media (hover:hover){.opts:not(.done) .opt:hover{background:var(--hl)}}
.opt.right{background:var(--ok-bg);border-color:var(--ok)}
.opt.wrong{background:var(--bad-bg);border-color:var(--pen);animation:shake .35s}
.opts.done .opt{pointer-events:none}
.fb{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:18px;padding:14px;
  border:2.5px solid;border-radius:16px}
.fb.ok{background:var(--ok-bg);border-color:var(--ok)}
.fb.bad{background:var(--bad-bg);border-color:var(--pen)}
.fbm{font-size:18px;overflow-wrap:anywhere}
.fbm b{font-weight:900}
.fb .btn{margin-left:auto}

/* letters */
.word{display:flex;flex-wrap:wrap;justify-content:center;gap:10px 22px;max-width:100%}
.wd{display:flex;gap:4px;flex-wrap:nowrap}
.ch,.slot{width:min(44px,calc((100vw - 100px)/11.5));height:min(56px,calc((100vw - 100px)/9));display:grid;place-items:center;
  font-weight:900;font-size:min(32px,calc((100vw - 100px)/14));padding:0;color:var(--ink)}
.ch{border-bottom:4px solid var(--edge)}
.ch.blank{border:2.5px dashed var(--orange);border-radius:10px;background:var(--hl)}
.ch.fill{background:var(--ok-bg);border-radius:10px;border-bottom:4px solid var(--ok)}
.letters,.tiles{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;min-height:60px}
.lt,.tile{width:60px;height:60px;border-radius:14px;border:2.5px solid var(--edge);background:var(--card);
  box-shadow:3px 3px 0 var(--shadow);font-weight:900;font-size:28px;color:var(--ink)}
.tile{width:54px;height:58px}
.lt:active,.tile:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--shadow)}
.lt.x{background:var(--bad-bg);border-color:var(--pen);opacity:.55;animation:shake .35s}
.tile.used{opacity:.22;pointer-events:none;box-shadow:none}
.slot{border:2.5px dashed var(--edge);border-radius:10px;background:transparent}
.slot.f{border-style:solid;background:var(--card)}
.slot.good{background:var(--ok-bg);border-color:var(--ok);border-style:solid}
.slot.bad{background:var(--bad-bg);border-color:var(--pen);border-style:solid;animation:shake .35s}
.inp{width:100%;max-width:420px;font:inherit;font-weight:800;font-size:28px;text-align:center;padding:14px;
  border:2.5px solid var(--edge);border-radius:16px;background:var(--paper);color:var(--ink)}
.inp.good{background:var(--ok-bg);border-color:var(--ok)}
.inp.bad{background:var(--bad-bg);border-color:var(--pen)}
.inrow{display:flex;flex-direction:column;align-items:center;gap:12px;width:100%}
.audiorow{display:flex;gap:14px;align-items:center}

/* dictionary */
.list{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:760px){.list{grid-template-columns:1fr 1fr}}
.row{display:grid;grid-template-columns:72px 1fr 46px;gap:14px;align-items:center;padding:10px 12px;text-align:left;
  background:var(--card);border:2.5px solid var(--edge);border-radius:18px;box-shadow:3px 3px 0 var(--shadow);width:100%}
.row.on{background:var(--hl)}
.row b{display:block;font-size:24px;font-weight:900;line-height:1.1;overflow-wrap:anywhere}
.row span{color:var(--ink-soft);font-size:16px}
.rowspk{width:46px;height:46px;border-radius:50%;background:var(--yellow);color:#1B2A4A;border:2.5px solid var(--edge);display:grid;place-items:center}
.rowspk svg{width:24px;height:24px}

/* results */
.res{text-align:center}
.stamp{width:156px;height:156px;border:7px solid var(--pen);border-radius:50%;color:var(--pen);font-size:112px;line-height:1;
  display:grid;place-items:center;margin:8px auto 4px;transform:rotate(-9deg);animation:stamp .55s cubic-bezier(.2,1.4,.4,1) both}
.res h2{margin:10px 0 2px;font-size:28px;font-weight:900}
.res p{margin:0;color:var(--ink-soft)}
.miss{margin:22px 0 6px;text-align:left}
.miss h3{margin:0 0 10px;font-size:18px}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{display:flex;align-items:center;gap:10px;padding:6px 14px 6px 6px;border:2.5px solid var(--edge);border-radius:14px;
  background:var(--card);box-shadow:2px 2px 0 var(--shadow);text-align:left}
.chip b{display:block;font-weight:900;line-height:1.1}.chip span{font-size:14px;color:var(--ink-soft)}
.acts{display:flex;flex-wrap:wrap;gap:14px;justify-content:center;margin-top:24px}

@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes stamp{from{transform:rotate(-32deg) scale(2.6);opacity:0}to{transform:rotate(-9deg) scale(1);opacity:1}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}

/* extras */
.pic .emo{line-height:1}
.pic.xs .emo{font-size:46px}.pic.sm .emo{font-size:40px}.pic.md .emo{font-size:72px}.pic.lg .emo{font-size:104px}.pic.mini .emo{font-size:22px}
.def{font-size:clamp(22px,5.6vw,30px);font-weight:800;text-align:center;line-height:1.25;overflow-wrap:anywhere}
.row span.dfn{display:block;color:var(--ink);font-size:15px;margin-top:3px}
.opts.one{grid-template-columns:1fr}
.ch.pn{border-bottom:none;width:auto;min-width:10px}
.card .now{position:absolute;right:14px;top:-15px;z-index:1;background:var(--pen);color:#fff;border:2.5px solid var(--edge);border-radius:99px;padding:0 14px;font-size:22px;line-height:1.3;transform:rotate(4deg)}
.face{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;width:100%;min-height:300px;background:transparent;border:0;padding:0;text-align:center}
.pic{background:#fff}
.pic.mini img{max-width:84%;max-height:84%}
.foot{margin:34px 0 0;font-size:13px;color:var(--ink-soft)}.foot a{color:inherit}
</style>
</head>

    const isB=blanks.indexOf(i)>=0;

/* level 6 */
function qBuild(w){

  let tiles=letters.map((ch,i)=>({ch:ch,id:i}));
  for(let t=0;t<12;t++){tiles=shuffle(tiles);if(letters.length<2||tiles.map(x=>x.ch).join('')!==letters.join(''))break;}
  const val=letters.map(()=>null);const slots=[];const tileEls={};
  let k=0;
  const wordEl=h('div',{class:'word'},parts.map(p=>h('div',{class:'wd'},Array.from(p).map(c=>{if(!/[a-z]/i.test(c))return h('span',{class:'ch pn'},c);
    const j=k++;const s=h('button',{class:'slot','aria-label':'Буква '+(j+1),onclick:()=>unplace(j)});slots.push(s);return s;}))));
  const extra=h('div',{class:'inrow'});
  function unplace(j){
    if(G.locked||val[j]==null)return;
    tileEls[val[j]].classList.remove('used');val[j]=null;slots[j].textContent='';slots[j].classList.remove('f');
  }
  function clearAll(){for(let j=0;j<val.length;j++){if(val[j]!=null){tileEls[val[j]].classList.remove('used');val[j]=null;slots[j].textContent='';slots[j].className='slot';}}}
  function place(t){
    if(G.locked)return;
    const j=val.indexOf(null);if(j<0)return;
    val[j]=t.id;slots[j].textContent=t.ch;slots[j].classList.add('f');tileEls[t.id].classList.add('used');

  }

    else{

      if(!extra.firstChild)extra.append(h('button',{class:'btn',onclick:()=>{
        if(G.locked)return;clearAll();
        letters.forEach((ch,j)=>{val[j]=j;slots[j].textContent=ch;slots[j].className='slot good';tileEls[j].classList.add('used');});
        extra.replaceChildren();complete(w);}},'Показать ответ'));
    }

/* level 7 */
function qDict(w){
  const v=pickVariant(w);const play=r=>speakText(audioOne(w,v),{rate:r});
  const ph=h('div',{class:'ph'});G.reveal=()=>{const p=pic(w,'md');if(p)ph.append(p);};
  const inp=h('input',{class:'inp',type:'text',autocomplete:'off',autocapitalize:'none',autocorrect:'off',spellcheck:'false',enterkeyhint:'done',placeholder:'Напиши слово','aria-label':'Слово'});
  const chk=h('button',{class:'btn primary',onclick:check},'Проверить');
  function check(){
    if(G.locked)return;const val=norm(inp.value);
    if(!val){inp.focus();return;}
    const ok=w.variants.some(x=>norm(x)===val);
    inp.disabled=true;chk.disabled=true;inp.classList.add(ok?'good':'bad');
    if(!ok)G.mistake=true;complete(w);
  }
  inp.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();e.stopPropagation();check();}});
  Q(h('p',{class:'ask'},'Послушай и напиши слово по-английски'),
    h('div',{class:'audiorow'},
      h('button',{class:'say xl','aria-label':'Послушать',html:SPK,onclick:()=>play(0.85)}),
      h('button',{class:'ic',title:'Медленно','aria-label':'Послушать медленно',onclick:()=>play(0.5)},'🐢')),
    ph,h('div',{class:'inrow'},inp,chk));
  setTimeout(()=>{play(0.85);if(window.matchMedia&&matchMedia('(hover:hover)').matches)inp.focus();},150);
}

document.addEventListener('keydown',e=>{
  if(!G)return;
  if(e.key==='Enter'){if(G.locked&&!(e.target.closest&&e.target.closest('button'))){e.preventDefault();next();}return;}
  if(!G.locked&&G.opts&&/^[1-4]$/.test(e.key)){const b=G.opts[+e.key-1];if(b)b.click();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)stopAudio();});

/* ---------- results ---------- */
function results(){
  stopAudio();
  const total=G.words.length;const pct=Math.round(G.ok/total*100);const mk5=markOf(pct);
  const gid=G.gid,level=G.level,g=GM(gid);
  PROG[gid]=PROG[gid]||{};
  if(PROG[gid][level]==null||pct>PROG[gid][level])PROG[gid][level]=pct;saveProg();
  const msg={5:'Отлично!',4:'Хорошо!',3:'Неплохо, но можно лучше',2:'Потренируйся ещё раз — получится!'}[mk5];
  const bad=G.bad.filter((w,i,a)=>a.indexOf(w)===i);
  const nodes=[
    h('div',{class:'top'},h('button',{class:'ic','aria-label':'К уровням',html:BACK,onclick:()=>levelsScreen(gid)}),
      h('h2',null,'Уровень '+level+' · '+LV[level].n,h('small',null,gid==='mix'?'Mix':g.mod+' · '+g.title))),
    h('div',{class:'qcard res'},
      h('div',{class:'stamp hand','aria-label':'Оценка '+mk5},String(mk5)),
      h('h2',null,msg),h('p',null,G.ok+' из '+total+' с первой попытки'),
      bad.length?h('div',{class:'miss'},h('h3',null,'Повтори эти слова'),
        h('div',{class:'chips'},bad.map(w=>h('button',{class:'chip',onclick:()=>speakText(audioList(w))},
          pic(w,'mini'),h('div',null,h('b',null,w.disp),h('span',null,w.ru)))))):null,
      h('div',{class:'acts'},
        h('button',{class:'btn primary',onclick:()=>startLevel(gid,level)},'Ещё раз'),
        level<7?h('button',{class:'btn',onclick:()=>startLevel(gid,level+1)},'Следующий уровень'):null,
        h('button',{class:'btn',onclick:()=>levelsScreen(gid)},'К уровням')))
  ];
  render(g,'narrow',nodes);
}

home();
})();
</script>
